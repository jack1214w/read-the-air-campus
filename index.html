<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;font-size:14px;font-family:system-ui,sans-serif}
img{max-width:100%}
[hidden]{display:none!important}
</style>
<title>讀空氣校園系列</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Huninn&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
/* Layout: 一欄窄版「作業簿」— 頂部方格進度、舞台畫布、提示列。淺色 = 綠格作業簿 + 紅筆；深色 = 黑板 + 粉筆 */
:root{
  --bg:#e9efe8;
  --paper:#fbfcf7;
  --grid:#d3e6d1;
  --line:#a9c7a7;
  --ink:#1c2420;
  --muted:#5d6b62;
  --red:#cf3426;
  --display:"Huninn","Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#101a15; --paper:#1d3327; --grid:#284636; --line:#3f6650;
    --ink:#eef0e4; --muted:#a7b9ac; --red:#ff8f7e; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#101a15; --paper:#1d3327; --grid:#284636; --line:#3f6650;
  --ink:#eef0e4; --muted:#a7b9ac; --red:#ff8f7e; color-scheme:dark;
}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--body);line-height:1.6}
.app{max-width:440px;margin:0 auto;padding-block:18px 28px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:12px}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.eyebrow{font-size:12px;letter-spacing:.12em;color:var(--muted);margin:0}
h1{font-family:var(--display);font-weight:400;font-size:26px;line-height:1.2;margin:2px 0 0;text-wrap:balance}
.pips{display:grid;grid-template-columns:repeat(10,20px);border-top:1px solid var(--line);border-left:1px solid var(--line)}
.pip{width:20px;height:20px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);
  display:grid;place-items:center;font-size:13px;line-height:1;color:var(--red);font-family:var(--display)}
.pip.cur{background:var(--grid)}
.pip.g-f{color:var(--ink)}
.stage{position:relative;width:100%;max-width:100%;aspect-ratio:360/420;background:var(--paper);
  border:2px solid var(--ink);border-radius:3px;overflow:hidden}
canvas{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;display:block;width:100%;height:100%;touch-action:none;cursor:pointer}
.ov{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;
  padding:22px;text-align:center;overflow:auto;
  background:color-mix(in srgb,var(--paper) 88%,transparent)}
.ov[hidden]{display:none}
.ov h2{font-family:var(--display);font-weight:400;margin:0;line-height:1.1}
.big{font-size:56px;letter-spacing:.04em}
.sub{font-family:var(--display);font-size:20px;color:var(--red);margin:0}
.ov p{margin:0;max-width:30ch}
.desc{color:var(--muted);font-size:14px}
.q{font-size:13px;letter-spacing:.14em;color:var(--muted);margin:0}
.lt{font-size:32px}
.btn{font-family:var(--display);font-size:18px;padding:9px 24px;border:2px solid var(--ink);background:var(--ink);
  color:var(--paper);border-radius:6px;cursor:pointer}
.btn:hover{background:var(--red);border-color:var(--red)}
.btn:focus-visible{outline:3px solid var(--red);outline-offset:3px}
.stamp{width:96px;height:96px;border:4px solid var(--red);border-radius:50%;color:var(--red);
  font-family:var(--display);font-size:34px;display:grid;place-items:center;transform:rotate(-12deg);
  animation:stamp .32s cubic-bezier(.2,1.6,.4,1) both}
.stamp.f{border-color:var(--ink);color:var(--ink);font-size:28px}
.stamp.o{font-size:30px}
@keyframes stamp{from{transform:rotate(-12deg) scale(1.8);opacity:0}to{transform:rotate(-12deg) scale(1);opacity:1}}
.msg{font-size:16px;font-weight:500}
.score{font-family:var(--display);font-size:56px;line-height:1;color:var(--red)}
.score small{font-size:22px}
.rank{font-family:var(--display);font-size:24px}
.list{list-style:none;margin:0;padding:0;width:100%;max-width:260px;display:grid;gap:2px;font-size:14px;text-align:left}
.list li{display:grid;grid-template-columns:22px 1fr;gap:8px;border-bottom:1px dashed var(--line);padding-block:2px}
.list b{font-family:var(--display);font-weight:400;color:var(--red);text-align:center}
.list .f b{color:var(--ink)}
.hint{margin:0;font-size:14px;color:var(--muted);min-height:1.6em;text-align:center}
.foot{margin:0;font-size:12px;color:var(--muted);text-align:center}
.back{font:inherit;font-size:12px;letter-spacing:.06em;color:var(--red);background:none;border:0;padding:0 8px 0 0;cursor:pointer}
.back:focus-visible{outline:2px solid var(--red);outline-offset:2px}
.back[hidden],.pips[hidden],.choices[hidden],.disc[hidden]{display:none}
.choices{display:grid;gap:8px}
.cq{margin:0;font-family:var(--display);font-size:16px}
.choice{font:inherit;font-size:15px;text-align:left;padding:10px 14px;border:2px solid var(--ink);background:var(--paper);color:var(--ink);border-radius:12px;cursor:pointer}
.choice:hover{border-color:var(--red);color:var(--red)}
.choice:focus-visible,.series:focus-visible{outline:3px solid var(--red);outline-offset:2px}
.series-list{display:grid;gap:10px;width:100%;max-width:290px}
.series{font:inherit;display:grid;gap:1px;text-align:left;padding:10px 16px;border:2px solid var(--ink);background:var(--paper);color:var(--ink);border-radius:8px;cursor:pointer}
.series:hover{border-color:var(--red)}
.series .no{font-size:12px;letter-spacing:.12em;color:var(--muted)}
.series b{font-family:var(--display);font-weight:400;font-size:22px}
.series:hover b{color:var(--red)}
.series .tag{font-size:13px;color:var(--muted)}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.btn.ghost{background:transparent;color:var(--ink)}
.btn.ghost:hover{background:transparent;color:var(--red);border-color:var(--red)}
.disc{border:2px dashed var(--line);padding:10px 14px;border-radius:8px;text-align:left;max-width:30ch;font-size:15px}
.disc b{display:block;font-family:var(--display);font-weight:400;color:var(--red)}
.list.wide{max-width:300px}
.list i{display:block;font-style:normal;font-size:12px;color:var(--muted);line-height:1.5}
@media (prefers-reduced-motion: reduce){.stamp{animation:none}}
</style>
</head>
<body>

<div class="app">
  <div class="top">
    <div>
      <p class="eyebrow"><button class="back" id="back" hidden>← 選單</button><span id="count">讀空氣</span></p>
      <h1 id="ltitle">選擇系列</h1>
    </div>
    <div class="pips" id="pips" aria-label="作答進度"></div>
  </div>
  <div class="stage">
    <canvas id="cv" aria-label="遊戲畫面"></canvas>
    <div class="ov" id="ov"></div>
  </div>
  <div class="choices" id="choices" hidden></div>
  <p class="hint" id="hint">選一個系列開始</p>
  <p class="foot">紅色的小人是你。校園日常篇考反應，將心比心篇看見別人的心情。</p>
</div>

<script>
(()=>{
const W=360,H=420,FL=350,SEAT=324;
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
const $=id=>document.getElementById(id);
const FONT='"Huninn","Noto Sans TC","PingFang TC",sans-serif';
let C={};
function readColors(){const cs=getComputedStyle(document.documentElement);
  ['paper','grid','line','ink','muted','red'].forEach(k=>C[k]=cs.getPropertyValue('--'+k).trim());}
function resize(){const r=cv.getBoundingClientRect(),d=window.devicePixelRatio||1;
  cv.width=Math.max(1,Math.round(r.width*d));cv.height=Math.max(1,Math.round(r.height*d));}
new ResizeObserver(resize).observe(cv);

const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,k)=>a+(b-a)*clamp(k,0,1);
const hit=(p,x,top,bot,w=26)=>Math.abs(p.x-x)<w&&p.y>top&&p.y<bot;

/* ---------- 繪圖小工具 ---------- */
function bg(){ctx.fillStyle=C.paper;ctx.fillRect(0,0,W,H);ctx.strokeStyle=C.grid;ctx.lineWidth=1;ctx.beginPath();
  for(let x=12;x<W;x+=24){ctx.moveTo(x+.5,0);ctx.lineTo(x+.5,H);}
  for(let y=6;y<H;y+=24){ctx.moveTo(0,y+.5);ctx.lineTo(W,y+.5);}ctx.stroke();}
function floor(y=FL){ctx.save();ctx.strokeStyle=C.ink;ctx.lineWidth=2.5;ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();ctx.restore();}
function person(x,y,o={}){
  const s=o.s||1,col=o.me?C.red:C.ink,dir=o.face==='left'?-1:1;
  const legL=22*s,bodyL=27*s,hr=10*s;
  ctx.save();ctx.strokeStyle=col;ctx.fillStyle=col;ctx.lineWidth=4*s;ctx.lineCap='round';ctx.lineJoin='round';
  const bob=o.bob||0;let hip;
  if(o.seated){hip={x,y:y+bob};ctx.beginPath();ctx.moveTo(hip.x,hip.y);ctx.lineTo(hip.x+dir*13*s,hip.y);ctx.lineTo(hip.x+dir*13*s,o.floor||FL);ctx.stroke();}
  else{hip={x,y:y-legL+bob};const sw=o.walk!=null?Math.sin(o.walk)*7*s:0;
    ctx.beginPath();ctx.moveTo(hip.x,hip.y);ctx.lineTo(x-5*s+sw,y);ctx.moveTo(hip.x,hip.y);ctx.lineTo(x+5*s-sw,y);ctx.stroke();}
  const a=(o.lean||0)*dir;
  const pt=k=>({x:hip.x+Math.sin(a)*bodyL*k,y:hip.y-Math.cos(a)*bodyL*k});
  const neck=pt(1),sh=pt(.82);
  ctx.beginPath();ctx.moveTo(hip.x,hip.y);ctx.lineTo(neck.x,neck.y);ctx.stroke();
  if(o.apron){ctx.save();ctx.fillStyle=C.paper;ctx.lineWidth=2*s;const p1=pt(.85),p0=pt(.02);ctx.beginPath();
    ctx.moveTo(p1.x-6*s,p1.y);ctx.lineTo(p1.x+6*s,p1.y);ctx.lineTo(p0.x+9*s,p0.y+5*s);ctx.lineTo(p0.x-9*s,p0.y+5*s);ctx.closePath();ctx.fill();ctx.stroke();ctx.restore();}
  ctx.beginPath();
  const arm=o.arm||'down',t=o.t||0,lx=Math.sin(a)*8;
  const A=(dx,dy)=>{ctx.moveTo(sh.x,sh.y);ctx.lineTo(sh.x+dx*s,sh.y+dy*s);};
  if(arm==='down'){A(-8+lx,15);A(8+lx,15);}
  else if(arm==='up'){A(-dir*8,15);A(dir*6,-23);}
  else if(arm==='wave'){A(-dir*8,15);A(dir*(9+Math.sin(t*10)*6),-19);}
  else if(arm==='forward'){A(dir*19,-1);A(dir*17,4);}
  else if(arm==='write'){A(-dir*8,15);A(dir*15,-17);}
  else if(arm==='cheer'){A(-13,-17);A(13,-17);}
  else if(arm==='hold'){A(dir*16,5);A(dir*13,10);}
  ctx.stroke();
  const hc={x:neck.x+Math.sin(a)*(hr+s),y:neck.y-Math.cos(a)*(hr+s)};
  ctx.beginPath();ctx.arc(hc.x,hc.y,hr,0,7);ctx.fill();
  if(o.glasses){ctx.strokeStyle=C.paper;ctx.lineWidth=1.6*s;const gx=hc.x+dir*4*s,gy=hc.y-s;ctx.beginPath();
    ctx.arc(gx-3.2*s,gy,2.6*s,0,7);ctx.moveTo(gx+5.8*s,gy);ctx.arc(gx+3.2*s,gy,2.6*s,0,7);ctx.stroke();}
  if(o.hat){ctx.fillStyle=C.paper;ctx.strokeStyle=col;ctx.lineWidth=2*s;ctx.beginPath();ctx.rect(hc.x-hr,hc.y-hr-6*s,hr*2,8*s);ctx.fill();ctx.stroke();}
  if(o.mask){ctx.fillStyle=C.paper;ctx.fillRect(hc.x+dir*2*s-5*s,hc.y+1.5*s,10*s,5.5*s);}
  ctx.restore();return hc;
}
function desk(x,dir=-1){ctx.save();ctx.strokeStyle=C.ink;ctx.lineWidth=3;ctx.lineCap='round';
  const a=x+dir*8,b=x+dir*38,top=SEAT-6;ctx.beginPath();
  ctx.moveTo(a,top);ctx.lineTo(b,top);ctx.moveTo(a+dir*3,top);ctx.lineTo(a+dir*3,FL);ctx.moveTo(b-dir*3,top);ctx.lineTo(b-dir*3,FL);
  ctx.moveTo(x-dir*7,SEAT+4);ctx.lineTo(x+dir*9,SEAT+4);ctx.moveTo(x-dir*5,SEAT+4);ctx.lineTo(x-dir*5,FL);
  ctx.moveTo(x-dir*7,SEAT+4);ctx.lineTo(x-dir*7,SEAT-20);ctx.stroke();ctx.restore();}
function board(){ctx.save();ctx.strokeStyle=C.ink;ctx.lineWidth=3;ctx.strokeRect(16,120,150,86);
  ctx.strokeStyle=C.muted;ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(30,142);ctx.lineTo(96,142);ctx.moveTo(30,160);ctx.lineTo(130,160);ctx.moveTo(30,178);ctx.lineTo(80,178);ctx.stroke();ctx.restore();}
function roundRect(x,y,w,h,r){r=Math.min(r,w/2,h/2);ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
function bubble(x,y,text,o={}){
  const fs=o.size||15;ctx.save();ctx.font=`${fs}px ${FONT}`;
  const w=ctx.measureText(text).width+20,h=fs+14;
  const bx=clamp(x-w/2,4,W-w-4),by=Math.max(4,y-h-12);
  const col=o.me?C.red:C.ink;
  ctx.fillStyle=C.paper;ctx.strokeStyle=col;ctx.lineWidth=2;
  roundRect(bx,by,w,h,8);ctx.fill();ctx.stroke();
  const tx=clamp(x,bx+12,bx+w-12);
  ctx.beginPath();ctx.moveTo(tx-6,by+h-1);ctx.lineTo(x,y-2);ctx.lineTo(tx+6,by+h-1);ctx.fill();
  ctx.beginPath();ctx.moveTo(tx-6,by+h);ctx.lineTo(x,y-2);ctx.lineTo(tx+6,by+h);ctx.stroke();
  ctx.fillStyle=col;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(text,bx+w/2,by+h/2+1);ctx.restore();
}
function mark(x,y,text,o={}){ctx.save();ctx.font=`${o.size||17}px ${FONT}`;ctx.fillStyle=o.me?C.red:(o.muted?C.muted:C.ink);
  ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(text,x,y);ctx.restore();}
function youTag(h,s=1){ctx.save();ctx.fillStyle=C.red;ctx.font=`13px ${FONT}`;ctx.textAlign='center';
  const y=h.y-16*s-12;ctx.fillText('你',h.x,y);ctx.beginPath();ctx.moveTo(h.x-4,y+4);ctx.lineTo(h.x+4,y+4);ctx.lineTo(h.x,y+9);ctx.fill();ctx.restore();}
function label(x,y,t){mark(x,y,t,{size:12,muted:1});}

/* ---------- 關卡 ---------- */
const LV1=[
{title:'營養午餐打菜',hint:'拖曳紅色的「你」去排隊',time:12,
 setup(s){s.line=[86,128,170,212,254];s.me={x:305,y:210};s.drag=false;s.cut=-1;},
 draw(s){floor();
  ctx.save();ctx.strokeStyle=C.ink;ctx.fillStyle=C.paper;ctx.lineWidth=3;ctx.lineCap='round';
  ctx.beginPath();ctx.moveTo(12,FL-38);ctx.lineTo(64,FL-38);ctx.moveTo(18,FL-38);ctx.lineTo(18,FL);ctx.moveTo(58,FL-38);ctx.lineTo(58,FL);ctx.stroke();
  ctx.beginPath();ctx.rect(16,FL-62,22,24);ctx.fill();ctx.stroke();ctx.beginPath();ctx.rect(40,FL-56,22,18);ctx.fill();ctx.stroke();ctx.restore();
  label(38,FL+18,'餐桶');
  if(s.t<2.4)bubble(38,FL-66,'下一位～');
  s.line.forEach((x,i)=>{const h=person(x,FL,{face:'left'});if(s.cut>=0&&i>=s.cut)mark(h.x,h.y-20,'!?');});
  const me=person(s.me.x,s.me.y,{me:1,face:'left',s:s.drag?1.06:1});
  if(!s.locked)youTag(me);},
 down(s,p){if(Math.abs(p.x-s.me.x)<32&&p.y>s.me.y-72&&p.y<s.me.y+12){s.drag=true;s.off={x:s.me.x-p.x,y:s.me.y-p.y};}},
 move(s,p){if(!s.drag)return;s.me.x=clamp(p.x+s.off.x,20,W-20);s.me.y=clamp(p.y+s.off.y,90,H-10);},
 up(s){if(!s.drag)return;s.drag=false;if(Math.abs(s.me.y-FL)>50)return;
  s.me.y=FL;const k=s.line.filter(lx=>lx<s.me.x).length;
  if(k===s.line.length){s.me.x=s.line[k-1]+42;end('p','乖乖排到隊伍最後面，打菜很順利。');}
  else{s.cut=k;for(let i=k;i<s.line.length;i++)s.line[i]+=42;s.me.x=s.line[k]-42;
   end('f',k===0?'你直接衝到餐桶前面，全班都看傻了。':'插隊！後面的同學都在瞪你。');}},
 timeout(){return['f','你一直站在旁邊發呆，菜都涼了。'];}},

{title:'走廊遇到老師',hint:'點擊畫面：跟老師打招呼',time:0,
 setup(s){s.tx=410;s.tap=-1;},
 update(s,dt){s.tx-=72*dt;if(!s.locked&&s.tx<30)end('f','你假裝沒看到，老師就這樣走過去了。',.6);},
 draw(s){ctx.save();ctx.strokeStyle=C.muted;ctx.lineWidth=2;
  for(const x of[22,112,202,292]){ctx.strokeRect(x,96,64,92);ctx.beginPath();ctx.moveTo(x+32,96);ctx.lineTo(x+32,188);ctx.stroke();}ctx.restore();
  floor();
  const bowing=s.tap>=0&&s.t-s.tap<1.1;
  const me=person(110,FL,{me:1,face:'right',lean:bowing?.6:0});
  const th=person(s.tx,FL,{s:1.15,glasses:1,face:'left',walk:s.t*8,arm:'hold'});
  if(s.tx<W+20&&s.tx>0)label(s.tx,FL+18,'老師');
  if(s.tap<0)youTag(me);
  if(s.tap>=0&&s.t-s.tap<1.3)bubble(me.x,me.y-14,'老師好！',{me:1});
  if(s.g==='p'&&s.t-s.tap>.45)bubble(th.x,th.y-14,'早安～');},
 down(s){if(s.tap>=0)return;s.tap=s.t;const d=s.tx-110;
  if(d>115){s.g='f';end('f','太早了，老師還在走廊另一頭，根本沒聽到。',1.3);}
  else if(d>=22){s.g='p';end('p','時機剛好，老師笑著點點頭。',1.6);}
  else if(d>-18){s.g='o';end('o','慢了半拍，老師已經快走過去了。',1.3);}
  else{s.g='f';end('f','老師都走過去了，你才對著背影鞠躬。',1.3);}}},

{title:'老師的冷笑話',hint:'點擊畫面：笑出來',time:6.4,
 setup(s){s.tap=-1;},
 draw(s){floor();board();
  const th=person(70,FL,{s:1.15,glasses:1,face:'right',arm:s.t>2.8&&s.t<4.6?'wave':'down',t:s.t});
  if(s.t>.4&&s.t<2.8)bubble(th.x+20,th.y-16,'為什麼海水是鹹的？');
  else if(s.t>=2.8&&s.t<4.8)bubble(th.x+20,th.y-16,'因為魚一直在流汗。');
  const laughing=s.t>3.5&&s.t<5.4;
  [175,240,305].forEach((x,i)=>{const me=i===1;
   const myLaugh=me&&s.tap>=0&&s.t-s.tap<1.6;
   const l=me?myLaugh:laughing;
   const h=person(x,SEAT,{seated:1,face:'left',me,bob:l?-Math.abs(Math.sin(s.t*14+i))*3:0});desk(x);
   if(me){if(s.tap<0)youTag(h);if(myLaugh)mark(h.x,h.y-24,'哈哈哈',{me:1,size:15});}
   else if(l&&(Math.floor(s.t*3)+i)%2===0)mark(h.x,h.y-24,'哈哈',{size:15});});},
 down(s){if(s.tap>=0)return;s.tap=s.t;
  if(s.t<2.8)end('f','老師還沒講到笑點，你就先笑了。',1.4);

   b:['o','你沒有笑，但小宇覺得只有自己一個人。','都沒有人理我……',35],
   c:['o','你說的是對的，可是大家都聽到了，小宇更不好意思。','我知道是 12 啦……不用講那麼大聲。',40],
   d:['p','一句「我也答錯了」，讓小宇覺得沒那麼丟臉。','原來不是只有我會答錯，好像沒那麼丟臉了。',80]}[k];
  mem.yu=R[3];
  end(R[0],R[1]+(s.guessOk?'（你也猜中了小宇的心情。）':''),1.6,[{x:175,y:SEAT-38,name:'小宇',thought:R[2],from:25,to:R[3]}]);}};

const GROUP={title:'分組討論',hint:'按住畫面，說出你的想法',time:0,
 discuss:'一直插不進話是什麼感覺？分組時，怎麼確定每個人都有機會說話？',
 setup(s){s.stage=0;s.t0=0;s.prog=0;s.mood=70;s.hk=0;s.hkAt=-9;s.hold=false;s.spoke={};s.reply=null;s.inv=-1;s.yuOut=mem.yu!=null&&mem.yu<40;},
 update(s,dt){const st=s.t-s.t0;
  if(s.stage===0){const busy=s.t-s.hkAt<(s.hk===4?3.4:2.4);
   if(s.hold&&!busy&&st>1)s.prog=Math.min(100,s.prog+dt*18);
   const th=[15,32,48,62][s.hk];if(th!=null&&s.prog>=th){s.hk++;s.hkAt=s.t;s.prog=Math.max(0,s.prog-10);s.mood-=14;}
   if(s.hk===4&&!busy){setStage(s,1);$('hint').textContent='換你當組長。點擊一位同學，問問他的想法';}}
  else{const sp=[[1.6,'小晴'],[3.4,'小宇'],[5.2,'小晴']];sp.forEach(([t,n])=>{if(st>=t&&!(n==='小宇'&&s.yuOut))s.spoke[n]=1;});
   if(!s.locked&&st>=13.4)end('f','討論時間結束，小安一句話都沒說到。',.4,[{x:295,y:280,name:'小安',
    cap:'小安剛剛，就跟第一段的你一樣。',thought:'我也有想法……可是一直插不進話。',from:50,to:15}]);}},
 draw(s){floor();const st=s.t-s.t0;
  if(s.stage===0){
   const P=[[70,'小晴','right'],[135,'阿哲','right'],[225,'小宇','left'],[295,'','left']];
   const busy=s.t-s.hkAt<(s.hk===4?3.4:2.4),cut=s.hk>0&&busy;
   const hs=P.map(([x,,f],i)=>person(x,318,{seated:1,face:f,me:i===3,lean:i===3&&cut?.25:0}));
   groupTable();P.forEach(([x,n])=>n&&label(x,FL+18,n));youTag(hs[3]);
   if(cut)bubble(hs[1].x,hs[1].y-14,['先聽我說！','我覺得我的比較好。','等一下啦，我還沒講完。','好，就照我的決定！'][s.hk-1],{size:17});
   else if(!s.hold)bubble(hs[1].x,hs[1].y-14,['我覺得要用紅色！','還要畫一隻恐龍！','然後旁邊再加……'][Math.floor(s.t/1.6)%3],{size:14});
   if(cut)mark(hs[3].x,hs[3].y-22,'……',{me:1});
   else if(s.hold&&st>1)bubble(hs[3].x,hs[3].y-14,['我想……','我覺得可以……','可以做成立體的……'][Math.min(2,Math.floor(s.prog/22))],{me:1,size:14});
   else if(s.prog<1&&st>1)mark(W/2,200,'按住畫面，說出你的想法',{size:15,muted:1});
   meter(24,40,140,s.prog,'你的想法');meter(196,40,140,s.mood,'你的心情',1);return;}
  const P=[[70,'小晴','right'],[135,'','right'],[225,'小宇','left'],[295,'小安','left']];
  const hs=P.map(([x,,f],i)=>i===2&&s.yuOut?{x,y:280}:person(x,318,{seated:1,face:f,me:i===1}));
  groupTable();P.forEach(([x,n],i)=>n&&label(x,FL+18,i===2&&s.yuOut?'（小宇去別組了）':n));
  if(!s.locked&&!s.rv)youTag(hs[1]);
  if(s.yuOut&&at({t:st},1.2,2.8))bubble(225,280,'我想去別組……',{size:14});
  const lines=[[1.6,3,0,'我覺得可以用紙箱！'],[3.4,4.8,2,'我想加一台小火車！'],[5.2,6.4,0,'還可以畫招牌！'],[7.6,8.8,1,'好，還有嗎？']];
  if(s.inv<0){lines.forEach(([a,b,i,t])=>{if(i===2&&s.yuOut)return;if(at({t:st},a,b)&&!(s.reply&&s.t-s.reply.t<1.6))bubble(hs[i].x,hs[i].y-14,t,{size:14,me:i===1});});
   if(at({t:st},2.4,2.9)||at({t:st},6.8,7.3)||at({t:st},10.4,10.9))mark(hs[3].x,hs[3].y-24,'我……',{size:12,muted:1});}
  if(s.reply&&s.t-s.reply.t<1.6){const i=s.reply.i;if(s.t-s.reply.t<.8)bubble(hs[1].x,hs[1].y-14,`${P[i][1]}，你覺得呢？`,{me:1,size:14});
   else bubble(hs[i].x,hs[i].y-14,s.reply.first?(i===0?'我覺得可以用紙箱！':'我想加一台小火車！'):'我剛剛說過了啊。',{size:14});}
  if(s.inv>=0){const a=s.t-s.inv;if(a<1)bubble(hs[1].x,hs[1].y-14,'小安，你覺得呢？',{me:1,size:14});else bubble(hs[3].x,hs[3].y-14,'可以做成立體的城市！',{size:14});}
  meter(24,40,140,Math.max(0,100-(st-1.2)/12.2*100),'討論時間');
  card('換你當組長了。',st);},
 down(s,p){if(s.stage===0){s.hold=true;return;}
  if(s.inv>=0||s.t-s.t0<1.2)return;
  if(hit(p,295,250,330,28)){s.inv=s.t;end('p','你主動問了小安，他的點子讓作品變得更特別。',2.2,[{x:295,y:280,name:'小安',
   cap:'小安剛剛，就跟第一段的你一樣。',thought:'終於有人問我了！我想到可以做成立體的。',from:30,to:90}]);return;}
  for(const[x,n,i]of[[70,'小晴',0],[225,'小宇',2]]){if(n==='小宇'&&s.yuOut)continue;
   if(hit(p,x,250,330,28)){if(s.spoke[n])s.reply={i,t:s.t};else{s.spoke[n]=1;s.reply={i,t:s.t,first:1};}return;}}},
 up(s){s.hold=false;}};

const LV2=[LV3[0],RULES,LV3[1],WRONG,GROUP];

/* ---------- 遊戲流程 ---------- */
const SERIES=[
  {no:'第一系列',name:'校園日常篇',levels:LV1,mode:'air',tag:'10 題・看懂氣氛，做出不尷尬的反應'},
  {no:'第二系列',name:'將心比心篇',levels:LV2,mode:'demo',tag:'5 題・先體驗、再猜心，最後才行動'}];
const MARK={p:'○',o:'△',f:'✕'},PTS={p:10,o:5,f:0};
const STAMPS={air:{p:'讚',o:'還行',f:'白目'},heart:{p:'暖心',o:'再想想',f:'傷到人了'},demo:{p:'開心',o:'還好',f:'難過'}};
const RANKS=[[90,'全班的空氣清淨機','有你在的地方就不會尷尬，老師都想讓你當班長。'],
  [70,'模範生','大部分場合都很得體，偶爾慢半拍。'],
  [50,'普通同學','有時讀得懂，有時讀不懂，很正常。'],
  [30,'有點白目','同學們常常默默地看著你。'],
  [0,'空氣是什麼？可以吃嗎？','你活出了自己的樣子。']];
const HRANKS=[[8,'將心比心小達人','每一次都先想到別人的感受，大家跟你在一起很安心。'],
  [6,'貼心的同學','大部分時候，你都很照顧別人的心情。'],
  [4,'正在練習的同學','有時候會忘記別人的感受，多練習就會越來越好。'],
  [0,'先停下來想一想','說話或行動之前，先想想：「如果我是他，會有什麼感覺？」']];
let ser=null,LV=[],idx=0,results=[],s=null,phase='title',token=0,last=0;
const ov=$('ov'),chs=$('choices');

function end(g,m,d=1.1,beats){if(!s||s.locked)return;s.locked=true;hideChoices();s.pend={g,m,at:s.t+d,beats:beats||null};}
function showChoices(q,list){chs.innerHTML=`<p class="cq">${q}</p>`+list.map(c=>`<button class="choice" data-k="${c.k}">${c.t}</button>`).join('');chs.hidden=false;}
function hideChoices(){chs.hidden=true;chs.innerHTML='';}
chs.addEventListener('click',e=>{const b=e.target.closest('[data-k]');if(!b||phase!=='play'||!s||s.locked)return;s.L.choose(s,b.dataset.k);});
function renderPips(){const p=$('pips');p.hidden=!LV.length;p.style.gridTemplateColumns=`repeat(${LV.length||1},20px)`;
  p.innerHTML=LV.map((L,i)=>{const r=results[i];
  return `<span class="pip${i===idx&&phase!=='final'?' cur':''}${r?' g-'+r.g:''}">${r?MARK[r.g]:''}</span>`;}).join('');}
function go(i){idx=i;const L=LV[i];hideChoices();$('back').hidden=false;s={t:0,L,locked:false,pend:null,beat:0,bt:0};L.setup(s);phase='intro';
  $('count').textContent=`${ser.name}｜第 ${i+1} 題 / 共 ${LV.length} 題`;$('ltitle').textContent=L.title;$('hint').textContent=L.hint;renderPips();
  ov.innerHTML=`<p class="q">${ser.name}・第 ${i+1} 題</p><h2 class="lt">${L.title}</h2><p class="desc">${L.hint}</p>`;ov.hidden=false;
  const tk=++token;setTimeout(()=>{if(tk===token&&phase==='intro')play();},1500);}
function play(){if(phase!=='intro')return;phase='play';ov.hidden=true;}
function swapStart(){phase='swap';s.beat=0;s.bt=0;$('hint').textContent='點一下畫面，繼續看下去';}
function nextBeat(){if(s.bt<.6)return;if(s.beat+1<s.pend.beats.length){s.beat++;s.bt=0;}else showResult();}
function showResult(){phase='result';const{g,m,beats}=s.pend,L=s.L;
  results[idx]={g,m,title:L.title,thought:beats?beats[0].name+'：「'+beats[0].thought+'」':''};renderPips();$('hint').textContent=L.hint;
  const word=STAMPS[ser.mode][g],lastQ=idx===LV.length-1;
  ov.innerHTML=`${ser.mode==='demo'&&beats?`<p class="q">${beats[0].name}的心情</p>`:''}<div class="stamp ${g}" style="font-size:${word.length>2?20:word.length>1?28:34}px">${word}</div><p class="msg">${m}</p>
   ${L.discuss?`<div class="disc" id="disc" hidden><b>討論卡</b>${L.discuss}</div>`:''}
   <div class="row">${L.discuss?'<button class="btn ghost" data-act="disc">討論卡</button>':''}<button class="btn" id="next" data-act="next">${lastQ?'看成績單':'下一題'}</button></div>`;
  ov.hidden=false;$('next').focus({preventScroll:true});}
function final(){phase='final';s=null;renderPips();hideChoices();
  const again='<div class="row"><button class="btn" data-act="again">再玩一次</button><button class="btn ghost" data-act="menu">選其他系列</button></div>';
  $('count').textContent=`${ser.name}｜成績單`;$('ltitle').textContent='放學了';
  if(ser.mode==='air'){const pct=Math.round(results.reduce((a,r)=>a+PTS[r.g],0)/(LV.length*10)*100);
    const[,rank,cm]=RANKS.find(r=>pct>=r[0]);$('hint').textContent='○ 讀懂空氣　△ 差一點　✕ 白目';
    ov.innerHTML=`<p class="q">空氣讀取率</p><div class="score">${pct}<small>%</small></div><h2 class="rank">${rank}</h2><p class="desc">${cm}</p>
     <ul class="list">${results.map(r=>`<li class="${r.g}"><b>${MARK[r.g]}</b><span>${r.title}</span></li>`).join('')}</ul>${again}`;}
  else if(ser.mode==='demo'){$('hint').textContent='○ 開心　△ 還好　✕ 難過';const n=results.filter(r=>r.g==='p').length;
    ov.innerHTML=`<p class="q">讓對方心情變好</p><div class="score">${n}<small> / ${LV.length}</small></div><h2 class="rank">回顧大家的心裡話</h2>
     <ul class="list wide">${results.map(r=>`<li class="${r.g}"><b>${MARK[r.g]}</b><span>${r.title}<i>${r.thought}</i></span></li>`).join('')}</ul>${again}`;}
  else{const n=results.filter(r=>r.g==='p').length;const[,rank,cm]=HRANKS.find(r=>n>=r[0]);
    $('hint').textContent='○ 暖心　△ 再想想　✕ 傷到人了';
    ov.innerHTML=`<p class="q">暖心選擇</p><div class="score">${n}<small> / ${LV.length}</small></div><h2 class="rank">${rank}</h2><p class="desc">${cm}</p>
     <p class="q">回顧大家的心裡話</p>
     <ul class="list wide">${results.map(r=>`<li class="${r.g}"><b>${MARK[r.g]}</b><span>${r.title}<i>${r.thought}</i></span></li>`).join('')}</ul>${again}`;}
  ov.hidden=false;ov.scrollTop=0;}
function title(){phase='title';s=null;ser=null;LV=[];results=[];hideChoices();token++;$('back').hidden=true;
  $('count').textContent='讀空氣';$('ltitle').textContent='選擇系列';$('hint').textContent='選一個系列開始';renderPips();
  ov.innerHTML=`<h2 class="big">讀空氣</h2><p class="desc">紅色的小人是你。看懂氣氛，也看見別人的心情。</p>
   <div class="series-list">${SERIES.map((x,i)=>`<button class="series" data-act="series" data-i="${i}"><span class="no">${x.no}</span><b>${x.name}</b><span class="tag">${x.tag}</span></button>`).join('')}</div>`;
  ov.hidden=false;}

ov.addEventListener('click',e=>{const b=e.target.closest('[data-act]');
  if(b){const a=b.dataset.act;
    if(a==='series'){ser=SERIES[+b.dataset.i];LV=ser.levels;results=[];delete mem.mei;go(0);}
    else if(a==='again'){results=[];delete mem.mei;go(0);}
    else if(a==='menu')title();
    else if(a==='disc'){const d=$('disc');d.hidden=!d.hidden;b.textContent=d.hidden?'討論卡':'收起討論卡';}
    else if(a==='next'){idx+1<LV.length?go(idx+1):final();}
    return;}
  if(phase==='intro')play();});

$('back').addEventListener('click',title);
function pos(e){const r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)/r.width*W,y:(e.clientY-r.top)/r.height*H};}
cv.addEventListener('pointerdown',e=>{if(phase==='swap'){nextBeat();return;}
  if(phase==='play'&&s&&s.rv){if(s.rv.bt>1){const f=s.rv.done;s.rv=null;$('hint').textContent=s.L.hint;f();}return;}
  if(phase!=='play'||!s||s.locked)return;try{cv.setPointerCapture(e.pointerId);}catch(_){}s.L.down&&s.L.down(s,pos(e));});
cv.addEventListener('pointermove',e=>{if(phase==='play'&&s&&s.L.move)s.L.move(s,pos(e));});
cv.addEventListener('pointerup',e=>{if(phase==='play'&&s&&s.L.up)s.L.up(s,pos(e));});
cv.addEventListener('pointercancel',e=>{if(phase==='play'&&s&&s.L.up)s.L.up(s,pos(e));});
document.addEventListener('keydown',e=>{if(phase==='swap'&&(e.key==='Enter'||e.key===' ')){e.preventDefault();nextBeat();}});

function drawSwap(){drawReveal(s.pend.beats[s.beat],s.bt);}
function drawReveal(b,bt){const a=Math.min(1,bt/.3),k=1-Math.pow(1-clamp(bt/1.4,0,1),3);
  ctx.save();ctx.globalAlpha=a*.84;ctx.fillStyle=C.paper;ctx.beginPath();ctx.rect(0,0,W,H);ctx.arc(b.x,b.y+20,54,0,7);ctx.fill('evenodd');
  ctx.globalAlpha=a;ctx.strokeStyle=C.red;ctx.lineWidth=2;ctx.setLineDash([6,5]);ctx.beginPath();ctx.arc(b.x,b.y+20,54,0,7);ctx.stroke();ctx.setLineDash([]);
  ctx.fillStyle=C.red;roundRect(14,12,W-28,34,6);ctx.fill();
  ctx.fillStyle=C.paper;ctx.font=`16px ${FONT}`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(b.banner||`換位思考｜${b.name}的心裡話`,W/2,30);
  if(b.cap)mark(W/2,64,b.cap,{size:14,muted:!b.cap2,me:!!b.cap2});if(b.cap2)mark(W/2,86,b.cap2,{size:13,muted:1});
  ctx.font=`15px ${FONT}`;const lines=wrap(b.thought,200),lw=Math.max(...lines.map(l=>ctx.measureText(l).width));
  const w=lw+28,h=lines.length*22+18,bx=clamp(b.x-w/2,10,W-w-10);
  const above=b.y-44-h>=(b.cap2?100:78),by=above?b.y-44-h:b.y+84;
  ctx.fillStyle=C.paper;ctx.strokeStyle=C.ink;ctx.lineWidth=2;ctx.setLineDash([5,4]);roundRect(bx,by,w,h,14);ctx.fill();ctx.stroke();ctx.setLineDash([]);
  const ty=above?by+h:by;[[.35,5],[.7,3]].forEach(([f,r])=>{ctx.beginPath();ctx.arc(lerp(clamp(b.x,bx+20,bx+w-20),b.x,f),lerp(ty,above?b.y-14:b.y+14,f),r,0,7);ctx.fill();ctx.stroke();});
  ctx.fillStyle=C.ink;lines.forEach((l,i)=>ctx.fillText(l,bx+w/2,by+20+i*22));
  ctx.restore();ctx.save();ctx.globalAlpha=a;ctx.fillStyle=C.paper;ctx.fillRect(14,H-74,W-28,62);ctx.restore();
  meter(30,H-46,W-60,lerp(b.from,b.to,k),`${b.name}的心情`,1);
  if(bt>1)mark(W/2,H-16,'點一下繼續 ▸',{size:12,muted:1});}

function titleScene(){floor();board();person(70,FL,{s:1.15,glasses:1,face:'right'});
  [175,240,305].forEach((x,i)=>{const h=person(x,SEAT,{seated:1,face:'left',me:i===1});desk(x);if(i!==1)mark(h.x,h.y-22,'…');});}
function frame(now){const dt=Math.min(.05,last?(now-last)/1000:0);last=now;readColors();
  if(s&&s.rv)s.rv.bt+=dt;
  else if(s&&(phase==='play'||phase==='result')){s.t+=dt;s.L.update&&s.L.update(s,dt);
    if(phase==='play'){if(!s.locked&&s.L.time&&s.t>=s.L.time){const r=s.L.timeout(s);end(r[0],r[1],r[2],r[3]);}
      if(s.pend&&s.t>=s.pend.at){s.pend.beats?swapStart():showResult();}}}
  if(phase==='swap'&&s){s.bt+=dt;if(s.bt>7)nextBeat();}
  const d=cv.width/W;ctx.setTransform(d,0,0,cv.height/H,0,0);bg();
  if(s){s.L.draw(s);if(s.rv)drawReveal(s.rv.b,s.rv.bt);if(phase==='swap')drawSwap();}else titleScene();
  requestAnimationFrame(frame);}
title();requestAnimationFrame(frame);
})();
</script>
